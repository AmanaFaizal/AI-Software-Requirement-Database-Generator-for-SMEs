<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Two checks for a protected request</title>
  <desc id="desc">First WSO2 checks the Publisher Internal-Key. Then Express checks the BizGuide login JWT in X-BizGuide-Token and business ownership. Both checks must pass for data to be returned.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#527086"/></marker></defs>
  <rect width="1200" height="540" rx="20" fill="#f5f8fb"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#152e43">
    <text x="48" y="52" font-size="28" font-weight="700">Two checks before business data is returned</text>
    <text x="48" y="84" font-size="19" fill="#527086">The verified demo uses a Publisher key plus the user's BizGuide login token.</text>
    <rect x="48" y="126" width="480" height="225" rx="16" fill="#fff" stroke="#b9ccdc" stroke-width="2"/>
    <circle cx="89" cy="168" r="22" fill="#183f5c"/><text x="89" y="176" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text>
    <text x="127" y="176" font-size="25" font-weight="700">WSO2 checks API access</text>
    <text x="76" y="221" font-size="20">Header: Internal-Key</text>
    <text x="76" y="255" font-size="19" fill="#527086">Is this gateway testing credential valid?</text>
    <rect x="76" y="281" width="420" height="43" rx="8" fill="#fff0ed"/>
    <text x="94" y="309" font-size="18" fill="#9c3d30">Missing credential → 401</text>
    <path d="M530 235H629" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="580" y="214" text-anchor="middle" font-size="17" fill="#527086">Pass</text>
    <rect x="647" y="126" width="505" height="225" rx="16" fill="#fff" stroke="#a9cfc0" stroke-width="2"/>
    <circle cx="688" cy="168" r="22" fill="#216b53"/><text x="688" y="176" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text>
    <text x="725" y="176" font-size="25" font-weight="700">Express checks the user</text>
    <text x="675" y="221" font-size="20">Header: X-BizGuide-Token</text>
    <text x="675" y="255" font-size="19" fill="#527086">Valid login JWT? Does this user own the shop?</text>
    <rect x="675" y="281" width="448" height="43" rx="8" fill="#fff0ed"/>
    <text x="693" y="309" font-size="18" fill="#9c3d30">Missing or invalid user JWT → 401</text>
    <path d="M900 353V387" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="647" y="402" width="505" height="60" rx="12" fill="#e6f4ef"/>
    <text x="900" y="439" text-anchor="middle" font-size="21" font-weight="700" fill="#216b53">Both pass → return the user's business data</text>
    <text x="48" y="417" font-size="18" fill="#527086">Ownership rejection in the inventory test: 404.</text>
    <text x="48" y="499" font-size="18" fill="#527086">Developer Portal OAuth uses Authorization instead of Internal-Key; that path needs a separate test.</text>
  </g>
</svg>
