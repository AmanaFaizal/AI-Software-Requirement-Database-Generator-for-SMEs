<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">How a BizGuide request travels</title>
  <desc id="desc">An API client calls WSO2 Classic Gateway on port 8243. The gateway forwards to Express on port 5000, which uses MySQL. Publisher deploys API revisions to the gateway.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#527086"/></marker></defs>
  <rect width="1200" height="470" rx="20" fill="#f5f8fb"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#152e43">
    <text x="48" y="52" font-size="28" font-weight="700">How a request travels</text>
    <text x="48" y="84" font-size="19" fill="#527086">The API gateway is the entry point for this tested flow.</text>
    <rect x="360" y="115" width="270" height="88" rx="12" fill="#e9f0f7" stroke="#b8cbdc"/>
    <text x="495" y="148" text-anchor="middle" font-size="23" font-weight="700">WSO2 Publisher</text>
    <text x="495" y="179" text-anchor="middle" font-size="18">Define, publish and deploy</text>
    <path d="M495 203V251" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="48" y="265" width="220" height="120" rx="14" fill="#fff" stroke="#c8d4df" stroke-width="2"/>
    <text x="158" y="307" text-anchor="middle" font-size="24" font-weight="700">API client</text>
    <text x="158" y="340" text-anchor="middle" font-size="18">Postman or test script</text>
    <rect x="358" y="265" width="275" height="120" rx="14" fill="#183f5c"/>
    <text x="495" y="300" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">WSO2 Classic Gateway</text>
    <text x="495" y="330" text-anchor="middle" font-size="18" fill="#fff">Checks gateway credential</text>
    <text x="495" y="357" text-anchor="middle" font-size="18" fill="#d5e6f3">localhost:8243</text>
    <rect x="722" y="265" width="220" height="120" rx="14" fill="#e6f4ef" stroke="#a9cfc0" stroke-width="2"/>
    <text x="832" y="300" text-anchor="middle" font-size="24" font-weight="700">Express API</text>
    <text x="832" y="330" text-anchor="middle" font-size="18">User and business checks</text>
    <text x="832" y="357" text-anchor="middle" font-size="18" fill="#385e52">localhost:5000</text>
    <rect x="1025" y="265" width="130" height="120" rx="14" fill="#fff" stroke="#c8d4df" stroke-width="2"/>
    <text x="1090" y="315" text-anchor="middle" font-size="23" font-weight="700">MySQL</text>
    <text x="1090" y="348" text-anchor="middle" font-size="18">App data</text>
    <path d="M270 325H343M635 325H706M944 325H1009" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="48" y="435" font-size="18" fill="#527086">Scope: local API integration. The existing React client still uses the direct backend path.</text>
  </g>
</svg>
